# Produção: PostgreSQL. Credenciais via variáveis de ambiente.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/biblioteca}
    username: ${DB_USER:biblioteca}
    password: ${DB_PASSWORD:biblioteca}

app:
  cors:
    origens-permitidas: ${CORS_ORIGENS:http://localhost:5173}
