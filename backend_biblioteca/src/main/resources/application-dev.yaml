# Desenvolvimento local: H2 em arquivo (os dados sobrevivem a reinícios).
# Console: http://localhost:8080/h2-console  (JDBC URL abaixo, usuário "sa", sem senha)
# Para zerar o banco, apague a pasta backend_biblioteca/data/.
spring:
  datasource:
    url: jdbc:h2:file:./data/biblioteca;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  h2:
    console:
      enabled: true

app:
  dados-exemplo: true
  seguranca:
    jwt-segredo: dev-segredo-local-nao-usar-em-producao-0123456789
    admin-senha-inicial: admin12345
