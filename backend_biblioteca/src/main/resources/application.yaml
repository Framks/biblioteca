# Configurações comuns a todos os perfis.
# Perfis: dev (padrão, H2 em arquivo), test (H2 em memória), prod (PostgreSQL).
spring:
  application:
    name: gerenciador
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # o schema é criado só pelo Flyway; o Hibernate apenas confere
    properties:
      hibernate:
        default_batch_fetch_size: 50
  flyway:
    locations: classpath:db/migration

server:
  port: 8080

app:
  seguranca:
    # HS256: pelo menos 32 caracteres. Cada perfil define o seu; em produção vem de JWT_SEGREDO.
    jwt-segredo: ${JWT_SEGREDO:}
    # Cookies só por HTTPS. Desligado em dev/test (http://localhost).
    cookie-seguro: false
    # Senha definida para admin@biblioteca.local se ele ainda não tiver senha (AdminInicialConfig).
    admin-senha-inicial: ${ADMIN_SENHA_INICIAL:}
  # Cria contas e registros de exemplo na primeira execução (DadosExemplo). Ligado no perfil dev.
  dados-exemplo: false
  fuso-horario: America/Fortaleza   # define o "hoje" das regras de prazo, atraso e suspensão
  cors:
    origens-permitidas: http://localhost:5173,http://localhost:3000
